project_name: UE Architecture Report
outputs:
  - format: html
    output_path: build/output/ue-architecture.html
  - format: pdf
    output_path: build/output/ue-architecture.pdf
style_profile:
  pdf_layout_mode: web
  template_html: ../../templates/base.html
  css: ../../styles/report.css
  options:
    document_theme: light
    heading_align: left
    text_align: justify
    list_spacing: normal
    table_density: normal
    zebra_tables: true
    title_color: '#0f172a'
    text_color: '#1f2937'
    table_header_bg: '#e0f2fe'
    table_border_color: '#7dd3fc'
    accent_color: '#0ea5e9'
metadata:
  title: UE Architecture Report
  classification: public
  language: en
  signatures_enabled: false
rules:
  normalize_headings: true
  fix_code_fences: true
  sanitize_links: false
