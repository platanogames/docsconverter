[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docsconverter"
version = "0.1.0"
description = "Desktop-oriented markdown converter powered by Pandoc"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0,<3",
  "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
ui = [
  "PySide6>=6.7.0,<7",
]
ux = [
  "PySide6>=6.7.0,<7",
  "qasync>=0.28.0,<1",
]
dev = [
  "pytest>=8.0.0,<9",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.5.0,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
